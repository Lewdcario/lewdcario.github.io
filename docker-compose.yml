services:
    tor:
        image: dperson/torproxy:latest
        container_name: portfolio-tor-proxy
        restart: unless-stopped
        ports:
            - '9050:9050'

    remote-signaling:
        build:
            context: ./services/remote-signaling
        container_name: portfolio-remote-signaling
        restart: unless-stopped
        environment:
            SIGNAL_PORT: '8787'
        ports:
            - '8787:8787'
        profiles:
            - remote

    nginx:
        image: nginx:1.27-alpine
        container_name: portfolio-remote-gateway
        restart: unless-stopped
        depends_on:
            - remote-signaling
        volumes:
            - ./infra/nginx/remote.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - '8080:80'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        profiles:
            - remote
